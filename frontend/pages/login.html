<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | StockPulse</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <div class="page">
        <header class="top-nav">
            <div class="container nav-content">
                <a class="nav-brand" href="../index.html">
                    <img src="../assets/logo.svg" alt="StockPulse logo">
                    <span>StockPulse</span>
                </a>
                <nav class="nav-links">
                    <a href="login.html">Login</a>
                    <a href="signup.html">Sign Up</a>
                </nav>
            </div>
        </header>

        <main class="page-content">
            <div class="container" style="max-width: 480px;">
                <div class="card">
                    <h2>Welcome Back</h2>
                    <p class="helper-text">Access your trading workspace.</p>
                    <form id="login-form" aria-label="Login form">
                        <div class="form-group">
                            <label for="login-email">Email address</label>
                            <input type="email" id="login-email" name="email" required placeholder="you@example.com">
                            <small class="helper-text" id="login-email-error"></small>
                        </div>
                        <div class="form-group">
                            <label for="login-password">Password</label>
                            <input type="password" id="login-password" name="password" required placeholder="Enter password">
                            <small class="helper-text" id="login-password-error"></small>
                        </div>
                        <div class="form-group" style="flex-direction: row; align-items: center; justify-content: space-between;">
                            <label style="display: flex; align-items: center; gap: 0.5rem; font-weight: 500;">
                                <input type="checkbox" id="remember-me">
                                Remember me
                            </label>
                            <a href="#">Forgot password?</a>
                        </div>
                        <div id="login-error" class="alert" style="display: none;"></div>
                        <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
                    </form>
                    <p style="margin-top: 1rem;">New here? <a href="signup.html">Create an account</a></p>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/utils/storage.js"></script>
    <script src="../js/utils/validators.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/pages/login.js"></script>
</body>
</html>
